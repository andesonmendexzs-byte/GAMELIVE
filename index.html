<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Pro Studio v2</title>
    <style>
        :root {
            --bg-color: #070510;
            --card-bg: #120e26;
            --card-border: #251c4a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 14, 38, 0.95);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .nav-tabs {
            display: flex;
            background: #120e26;
            border-bottom: 1px solid var(--card-border);
            padding: 4px;
            gap: 4px;
            overflow-x: auto;
        }

        .tab-btn {
            background: #090614;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #fff;
            background: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        main {
            flex: 1;
            padding: 16px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--accent-cyan);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: #090614;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }
