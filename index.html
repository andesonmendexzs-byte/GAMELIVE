
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Pro Studio</title>
    <style>
        :root {
            --bg-color: #070510;
            --card-bg: #120e26;
            --card-border: #251c4a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 14, 38, 0.9);
            border-bottom: 1px solid var(--card-border);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-title h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            background: rgba(18, 14, 38, 0.95);
            overflow-x: auto;
            border-bottom: 1px solid var(--card-border);
            padding: 0 8px;
            scrollbar-width: none;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 14px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }

        main {
            flex: 1;
            padding: 16px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: #090614;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        }

        .btn-danger {
            background: var(--danger);
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }

        .fx-card {
            background: #090614;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
        }

        .fx-card.active {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.12);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <div class="logo-title">
                <h1 id="appHeaderTitle">StreamPulse</h1>
            </div>
        </div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="openTab('voice', this)">🎤 Voz FX</button>
        <button class="tab-btn" onclick="openTab('sfx', this)">🔊 Sons</button>
        <button class="tab-btn" onclick="openTab('adm', this)" style="color: var(--accent-pink);">⚙️ ADM Edit</button>
    </nav>

    <main>
        <!-- 1. VOZ FX -->
        <div id="voice" class="tab-content active">
            <div class="card">
                <h3>🎤 Modificador de Voz</h3>
                <button class="btn" id="micToggleBtn" onclick="toggleMic()">🔴 Ativar Microfone</button>
            </div>
        </div>

        <!-- 2. SONS -->
        <div id="sfx" class="tab-content">
            <div class="card">
                <h3>🔊 Mesa de Sons</h3>
                <button class="btn" onclick="triggerSFX()">🔊 Tocar Efeito Sonoro</button>
            </div>
        </div>

        <!-- 3. ADM EDIT -->
        <div id="adm" class="tab-content">
            <div class="card">
                <h3 style="color: var(--accent-pink);">⚙️ Painel ADM</h3>
                <div class="form-group">
                    <label>Novo Nome da App</label>
                    <input type="text" id="admAppTitle" placeholder="Ex: Meu Estúdio">
                </div>
                <button class="btn btn-pink" onclick="saveAdm()">💾 Salvar Alterações</button>
                <button class="btn btn-danger" onclick="resetAdm()" style="margin-top:8px;">🔄 Restaurar</button>
            </div>
        </div>
    </main>

    <script>
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function loadAdm() {
            const title = localStorage.getItem('sp_title') || 'StreamPulse';
            document.getElementById('appHeaderTitle').innerText = title;
            document.getElementById('admAppTitle').value = title;
        }

        function saveAdm() {
            const val = document.getElementById('admAppTitle').value.trim();
            if (val) {
                localStorage.setItem('sp_title', val);
                loadAdm();
                alert('Salvo com sucesso!');
            }
        }

        function resetAdm() {
            localStorage.clear();
            location.reload();
        }

        let audioCtx, micStream, isMicOn = false;
        async function toggleMic() {
            const btn = document.getElementById('micToggleBtn');
            if (!isMicOn) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = audioCtx.createMediaStreamSource(micStream);
                    src.connect(audioCtx.destination);
                    isMicOn = true;
                    btn.innerText = "🟢 Microfone Ativo";
                    btn.classList.add('btn-danger');
                } catch(e) {
                    alert('Permite o acesso ao microfone.');
                }
            } else {
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                if (audioCtx) audioCtx.close();
                isMicOn = false;
                btn.innerText = "🔴 Ativar Microfone";
                btn.classList.remove('btn-danger');
            }
        }

        function triggerSFX() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        window.onload = loadAdm;
    </script>
</body>
</html>
